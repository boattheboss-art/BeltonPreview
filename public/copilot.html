<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BELTON AI</title>
  <link rel="icon" type="image/png" href="belton_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="copilot.css?v=20260916_v2">
</head>
<body class="gemini-theme">

  <!-- Main App Shell -->
  <div class="gemini-app">
    
    <!-- Top Navigation Bar -->
    <header class="gemini-topbar">
      <div class="topbar-left">
        <a href="/" class="brand-link" title="กลับหน้าแรก">
          <img src="belton_logo.png" alt="BELTON AI Logo" class="gemini-brand-logo-img">
          <div class="brand-text">
            <span class="brand-title">BELTON AI</span>
          </div>
        </a>
        <div class="model-badge">
          <span class="status-dot online"></span>
          <span class="model-name">Qwen 2.5:3b (Local RTX 3050 GPU)</span>
        </div>
      </div>

      <div class="topbar-right">
        <button type="button" id="btnClearChat" class="topbar-btn" title="ล้างประวัติการสนทนา">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
          </svg>
          <span>ล้างแชท</span>
        </button>

        <a href="/factory" class="topbar-action-btn primary" title="เข้าสู่โรงงานคลีนรูม 3D">
          <span class="btn-icon">🏭</span>
          <span>ไปที่ 3D Cleanroom</span>
        </a>
      </div>
    </header>

    <!-- Main Chat Viewport -->
    <main class="gemini-main" id="geminiMain">
      <div class="chat-container" id="chatContainer">
        
        <!-- Minimalist Watermark Hero (Clean Spacious Empty State) -->
        <div class="gemini-hero minimal-watermark-hero" id="geminiHero">
          <div class="faint-brand-watermark">
            <img src="belton_logo.png" alt="BELTON AI Logo" class="faint-watermark-emblem">
            <h1 class="faint-watermark-text">BELTON AI</h1>
          </div>
        </div>

        <!-- Dynamic Message Feed -->
        <div class="messages-feed" id="messagesFeed"></div>

      </div>
    </main>

    <!-- Bottom Floating Gemini Pill Input -->
    <footer class="gemini-footer">
      <div class="input-container">
        <form id="geminiChatForm" class="gemini-input-pill">
          <div class="input-sparkle-pill">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path fill="url(#geminiGrad)" d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5z"/>
            </svg>
          </div>
          <input 
            type="text" 
            id="chatInput" 
            class="gemini-text-input" 
            placeholder="ถามสถานะเครื่องจักร, สถิติ SCADA, หรือระเบียบคลีนรูมที่นี่..." 
            autocomplete="off" 
            required 
          />
          <button type="submit" id="btnSubmit" class="gemini-send-btn" title="ส่งคำถาม">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
        </form>
        <div class="input-disclaimer">
          🔒 Belton AI Copilot เชื่อมต่อฐานข้อมูล SCADA สด และประมวลผลผ่านการ์ดจอ NVIDIA RTX ในเครื่องของคุณ 100%
        </div>
      </div>
    </footer>

  </div>

  <script src="js/copilot.js?v=20260916_v2"></script>
</body>
</html>
