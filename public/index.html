<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BELTON AI — Intelligent Industrial Automation</title>
  <link rel="icon" type="image/png" href="belton_logo.png" />
  <meta name="description" content="BELTON AI — Intelligent Industrial Automation. Dark Sci-Fi 3D Platform." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="css/belton-navbar.css" />
  <script src="js/belton-navbar.js" defer></script>

  <!-- Import Map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <!-- Preloader Fail-safe (Never get stuck on black screen) -->
  <script>
    setTimeout(function() {
      var pre = document.getElementById('sitePreloader');
      if (pre && !pre.classList.contains('flash-out')) {
        pre.classList.add('flash-out');
        setTimeout(function() { pre.style.display = 'none'; }, 600);
      }
      var hdr = document.getElementById('siteHeader');
      if (hdr) hdr.classList.add('intro-visible', 'just-authenticated');
      var bgTxt = document.getElementById('bgBeltonText');
      if (bgTxt) bgTxt.classList.add('play-intro');
      var heroTxt = document.getElementById('heroOverlayContent');
      if (heroTxt) heroTxt.classList.add('intro-visible');
      var rbtCanvas = document.getElementById('bentonCanvas');
      if (rbtCanvas) rbtCanvas.classList.add('is-visible');
    }, 1500);
  </script>
</head>
<body class="is-logged-in">
  <!-- STEP 1: SPINNING STAR LOADING SCREEN (No progress bar) -->
  <div id="sitePreloader" class="site-preloader">
    <div class="preloader-star-wrapper">
      <svg class="preloader-star" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5L12 0Z" />
      </svg>
      <div class="preloader-glow-ring"></div>
    </div>
  </div>

  <!-- STEP 0: Fullscreen Spline 3D Background Environment or Low-Spec CSS Grid (z-index 0) -->
  <div id="bgCyberGrid" class="bg-cyber-grid" aria-hidden="true"></div>
  <canvas id="bgSplineCanvas" class="bg-spline-canvas" aria-hidden="true"></canvas>

  <!-- STEP 2: Background "BELTON" Typography (z-1 pointer-events-none) -->
  <div id="bgBeltonText" class="bg-belton-container" aria-hidden="true">
    <span class="belton-letter" data-index="0">B</span>
    <span class="belton-letter" data-index="1">E</span>
    <span class="belton-letter" data-index="2">L</span>
    <span class="belton-letter" data-index="3">T</span>
    <span class="belton-letter" data-index="4">O</span>
    <span class="belton-letter" data-index="5">N</span>
  </div>

  <!-- STEP 3: Fullscreen Spline 3D Robot Component (z-10 floating in front of text) -->
  <canvas id="bentonCanvas" class="hero-canvas" aria-label="3D BELTON Robot Showcase"></canvas>

  <!-- Top Floating Pill Navigation (z-50) -->
  <header id="siteHeader" class="site-header">
    <nav class="nav-container" aria-label="Main Navigation">
      <a href="/" class="nav-logo" aria-label="BELTON AI Home">
        <img src="belton_logo.png" alt="BELTON AI Logo" style="height: 32px; width: 32px; border-radius: 50%; object-fit: contain; margin-right: 10px; vertical-align: middle;">
        <span class="nav-logo-text">BELTON AI</span>
      </a>

     <ul id="navLinks" class="nav-links" style="display: flex; flex-wrap: nowrap; white-space: nowrap; gap: 8px; list-style: none; margin: 0; padding: 0;">
  <li><a href="/" class="nav-link nav-link-highlight active" data-nav="home">HOME</a></li>
  <li><a href="/explorer" class="nav-link nav-link-highlight" id="nav3dModelLink" data-nav="explorer"><span>3D MODEL AR</span></a></li>
  <li><a href="/product" class="nav-link nav-link-highlight" id="navProductLink" data-nav="product"><span>PRODUCT</span></a></li>
  <li><a href="/manufacturing" class="nav-link nav-link-highlight" id="navMfgLink" data-nav="manufacturing"><span>History of BELTON</span></a></li>
  <li><a href="/factory" class="nav-link nav-link-highlight" id="navFactoryLink" data-nav="factory"><span>Simulation room</span></a></li>
  <li><a href="/copilot" class="nav-link nav-link-highlight nav-ai-pill" id="navCopilotLink" data-nav="copilot">
    <span>BELTON AI</span>
  </a></li>
</ul>

      <div class="nav-actions">
        <button id="audioToggleBtn" class="audio-toggle-pill" aria-label="Toggle Audio" title="Sound Effects">
          <span style="font-family: var(--font-mono, monospace); font-size: 0.8rem; letter-spacing: 1.2px; font-weight: 600;">AUDIO</span>
        </button>
      </div>
    </nav>
  </header>

  <!-- Content Wrapper (z-20) -->
  <div class="content-wrapper">
    <!-- Hero Section -->
    <main id="hero" class="hero-section">
      <!-- 4-Point Sparkle Stars in corners -->
      <svg class="sparkle-star top-left" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5L12 0Z" />
      </svg>
      <svg class="sparkle-star bottom-right" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5L12 0Z" />
      </svg>

      <!-- Hero Subtitle -->
      <div id="heroOverlayContent" class="hero-overlay-content">
        <p class="hero-subtitle">Rajamangala University of Technology Thanyaburi</p>
        <div class="hero-cta-group">
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
